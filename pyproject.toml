[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raku"
version = "0.4.0"
description = "Concept-guided prompt learning for few-shot multi-label fundus disease recognition"
readme = { file = "README", content-type = "text/plain" }
requires-python = "==3.10.*"
license = { text = "MIT" }
authors = [{ name = "Retinal Concept Modelling Group" }]
keywords = [
  "fundus",
  "vision-language",
  "few-shot",
  "multi-label",
  "concept-bottleneck",
]
dependencies = [
  "torch==2.1.0",
  "torchvision==0.16.0",
  "numpy==1.24.4",
  "pillow==10.1.0",
  "tomli==2.0.1",
  "clize==5.0.1",
  "tqdm==4.66.1",
  "open-clip-torch==2.23.0",
  "transformers==4.35.0",
]

[project.optional-dependencies]
bench = [
  "pytest==7.4.3",
  "ruff==0.1.6",
  "black==23.11.0",
  "isort==5.12.0",
  "mypy==1.7.1",
  "pre-commit==3.5.0",
  "onnx==1.15.0",
  "onnxruntime==1.16.3",
]

[project.scripts]
raku = "raku.wheelhead.console:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raku = ["py.typed"]

[tool.black]
line-length = 96
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 96
known_first_party = ["raku"]

[tool.ruff]
line-length = 96
target-version = "py310"
src = ["src", "trials"]
select = ["E", "F", "I", "W", "B", "UP", "C4", "SIM"]
ignore = ["B008", "B905"]

[tool.ruff.per-file-ignores]
"trials/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["trials"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/raku"]
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
plugins = []

[[tool.mypy.overrides]]
module = [
  "clize.*",
  "torchvision.*",
  "open_clip.*",
  "transformers.*",
  "onnxruntime.*",
  "PIL.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "raku.*"
disable_error_code = ["no-any-return", "no-untyped-call", "type-arg"]
